}

window.__publish=async function(pm){
  pm.textContent='';
  if(!art){pm.textContent='Veröffentlichen ist hier nicht möglich.';return;}
  var doc=document.documentElement.cloneNode(true);
  ['app-d','app-f','snow'].forEach(function(i){doc.querySelector('#'+i).innerHTML='';});
  doc.querySelector('#data-d').textContent=JSON.stringify({drinks:window.__D.data()}).replace(/</g,'\\u003c');
  doc.querySelector('#data-f').textContent=JSON.stringify({dishes:window.__F.data()}).replace(/</g,'\\u003c');
  doc.querySelector('body').className='t-d';
  doc.querySelector('#app-h').removeAttribute('hidden');doc.querySelector('#app-d').setAttribute('hidden','');doc.querySelector('#app-f').setAttribute('hidden','');
  doc.querySelector('#tabs').setAttribute('hidden','');
  try{await art.publish('<!DOCTYPE html>\n'+doc.outerHTML);}
  catch(err){if(err&&err.code==='conflict')return;pm.textContent='Das hat leider nicht geklappt ('+((err&&err.code)||'Fehler')+').';}
};
